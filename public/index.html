<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NBT Production Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Emulsion Plant Production Board</h1>
    </header>
    
    <div class="board">
		<div class="column" id="queued">
			<h2>Queued</h2>
			<div class="ticket-container"></div>
		</div>
		
		<div class="column" id="in-production">
			<h2>In Production</h2>
			<div class="ticket-container"></div>
		</div>
		
		<div class="column" id="produced">
			<h2>Produced</h2>
			<div class="ticket-container"></div>
		</div>
	</div>

    <script src="app.js"></script>
</body>
</html>
